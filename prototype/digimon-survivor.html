<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digimon Survivor — Vertical Slice</title>
<style>body{margin:0;background:#101827;color:#e5eefc;font:16px system-ui;text-align:center}canvas{display:block;margin:12px auto;max-width:96vw;background:#182b35;border:2px solid #567;image-rendering:pixelated}button{padding:9px 16px;background:#2563eb;color:white;border:0;border-radius:6px}p{margin:8px}</style></head>
<body><h1>Digimon Survivor — prototipo</h1><p>Agumon (placeholder original) · WASD/flechas para moverse · ataque automático</p>
<p id="hud" role="status"></p><canvas id="game" width="800" height="480"></canvas><button id="restart">Reiniciar</button>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),hud=document.getElementById('hud');
const keys=new Set(),duration=60;
let state;
function reset(){state={time:0,hp:100,kills:0,spawn:0,shot:0,ended:false,player:{x:400,y:240},enemies:[],shots:[]};}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function update(dt){
 if(state.ended)return;
 state.time+=dt;state.spawn-=dt;state.shot-=dt;
 const p=state.player;
 let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));
 let dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));
 const length=Math.hypot(dx,dy)||1;
 p.x=clamp(p.x+dx/length*190*dt,14,786);p.y=clamp(p.y+dy/length*190*dt,14,466);
 if(state.spawn<=0){state.spawn=.7;const side=Math.floor(Math.random()*4);state.enemies.push({x:side===0?0:side===1?800:Math.random()*800,y:side===2?0:side===3?480:Math.random()*480,hp:2});}
 if(state.shot<=0&&state.enemies.length){state.shot=.38;const target=state.enemies.reduce((a,b)=>distance(p,a)<distance(p,b)?a:b);const angle=Math.atan2(target.y-p.y,target.x-p.x);state.shots.push({x:p.x,y:p.y,vx:Math.cos(angle)*370,vy:Math.sin(angle)*370,ttl:1.7});}
 for(const e of state.enemies){const d=Math.max(1,distance(e,p));e.x+=(p.x-e.x)/d*55*dt;e.y+=(p.y-e.y)/d*55*dt;if(d<19)state.hp-=18*dt;}
 for(const s of state.shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.ttl-=dt;for(const e of state.enemies){if(e.hp>0&&distance(s,e)<16){e.hp-=1;s.ttl=0;break;}}}
 state.kills+=state.enemies.filter(e=>e.hp<=0).length;
 state.enemies=state.enemies.filter(e=>e.hp>0);state.shots=state.shots.filter(s=>s.ttl>0);
 if(state.hp<=0||state.time>=duration){state.hp=Math.max(0,state.hp);state.ended=true;}
}
function draw(){
 ctx.clearRect(0,0,800,480);
 ctx.fillStyle='#25404a';for(let x=0;x<800;x+=40)for(let y=0;y<480;y+=40)ctx.strokeRect(x,y,40,40);
 for(const e of state.enemies){ctx.fillStyle='#f97373';ctx.beginPath();ctx.arc(e.x,e.y,11,0,Math.PI*2);ctx.fill();}
 for(const s of state.shots){ctx.fillStyle='#ffb020';ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fill();}
 const p=state.player;ctx.fillStyle='#ff9c2a';ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('AGUMON',p.x,p.y-20);
 hud.textContent='HP '+Math.ceil(state.hp)+' · KOs '+state.kills+' · Tiempo '+Math.floor(state.time)+'/'+duration+'s'+(state.ended?(state.hp>0?' · ¡Victoria!':' · Derrota'):'');
}
let last=0;function frame(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);draw();requestAnimationFrame(frame);}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>keys.clear());
document.getElementById('restart').addEventListener('click',reset);
reset();requestAnimationFrame(frame);
</script></body></html>
