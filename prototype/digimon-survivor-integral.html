<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Digimon Survivor — Demo integral</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1424;color:#e9f2ff;font:15px system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#15233b;gap:8px}h1{font-size:20px;margin:0}h2{font-size:20px;margin:6px 0 14px}h3{margin:10px 0}main{max-width:960px;margin:auto;padding:14px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}button{border:1px solid #46608b;border-radius:9px;background:#263b61;color:white;padding:10px 13px;cursor:pointer;font:inherit}button.primary{background:#2563eb;border-color:#3b82f6}button:disabled{opacity:.45}button.active{background:#155e75}button:focus-visible{outline:3px solid #fbbf24}.panel{background:#15233b;border:1px solid #304465;border-radius:12px;padding:14px;margin:10px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.card{background:#1d304f;border:1px solid #405a7d;border-radius:10px;padding:12px}.muted{color:#a7b8d3}.tag{display:inline-block;padding:2px 7px;border-radius:7px;background:#334155;font-size:12px}#game{display:block;width:100%;max-height:65vh;aspect-ratio:800/480;background:#193038;border:2px solid #57738a;border-radius:8px;touch-action:none}#gameWrap{position:relative}#stick{position:absolute;bottom:18px;left:18px;width:116px;height:116px;border:2px solid #b6d5f6;border-radius:50%;background:#294b6a88;touch-action:none;display:none}#knob{position:absolute;left:39px;top:39px;width:34px;height:34px;border-radius:50%;background:#9cd3ff}#runHud{margin:8px 0;font-weight:bold}#levelChoices{display:none;position:absolute;inset:10%;background:#101d32ee;border:2px solid #fbbf24;border-radius:12px;padding:15px;overflow:auto;z-index:3}#levelChoices button{display:block;width:100%;margin:8px 0}#status{min-height:22px;color:#fbbf24}footer{padding:16px;text-align:center;color:#a7b8d3}@media(pointer:coarse){#stick{display:block}#game{max-height:65vh}}@media(max-width:500px){main{padding:8px}header{padding:9px}h1{font-size:17px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:9px}button{padding:9px}}
</style></head><body><header><h1>Digimon Survivor <span class="tag">Demo v0.4</span></h1><span id="wallet"></span></header><main><nav class="tabs" id="tabs"></nav><div id="content"></div><div id="status" role="status"></div></main><footer>Fangame gratuito · Gráficos geométricos provisionales · Guardado local</footer>
<script>
'use strict';
const SPECIES=[
{id:'agumon',name:'Agumon',stage:'Rookie',attribute:'Vaccine',field:'Dragons Roar',element:'Fire',attack:'Pepper Breath',color:'#ff9f32',hp:110,speed:185,damage:16,rate:.42},
{id:'gabumon',name:'Gabumon',stage:'Rookie',attribute:'Data',field:'Nature Spirits',element:'Ice',attack:'Blue Blaster',color:'#88c9ed',hp:125,speed:165,damage:17,rate:.50},
{id:'patamon',name:'Patamon',stage:'Rookie',attribute:'Data',field:'Wind Guardians',element:'Air',attack:'Boom Bubble',color:'#f8d07b',hp:95,speed:205,damage:14,rate:.32},
{id:'tentomon',name:'Tentomon',stage:'Rookie',attribute:'Vaccine',field:'Nature Spirits',element:'Electric',attack:'Super Shocker',color:'#e94b52',hp:120,speed:160,damage:19,rate:.55},
{id:'greymon',name:'Greymon',stage:'Champion',attribute:'Vaccine',field:'Dragons Roar',element:'Fire',attack:'Mega Flame',color:'#f58b33',hp:150,speed:145,damage:25,rate:.65},
{id:'garurumon',name:'Garurumon',stage:'Champion',attribute:'Vaccine',field:'Nature Spirits',element:'Ice',attack:'Fox Fire',color:'#9cdbef',hp:130,speed:195,damage:21,rate:.45},
{id:'angemon',name:'Angemon',stage:'Champion',attribute:'Vaccine',field:'Virus Busters',element:'Light',attack:'Heaven Knuckle',color:'#f5eac0',hp:145,speed:170,damage:23,rate:.52},
{id:'devimon',name:'Devimon',stage:'Champion',attribute:'Virus',field:'Nightmare Soldiers',element:'Dark',attack:'Death Claw',color:'#9b85d5',hp:140,speed:180,damage:22,rate:.48},
{id:'metalgreymon',name:'MetalGreymon',stage:'Ultimate',attribute:'Vaccine',field:'Dragons Roar',element:'Fire',attack:'Giga Destroyer',color:'#c87740',hp:165,speed:145,damage:32,rate:.72},
{id:'weregarurumon',name:'WereGarurumon',stage:'Ultimate',attribute:'Vaccine',field:'Nature Spirits',element:'Neutral',attack:'Wolf Claw',color:'#a5c9e8',hp:145,speed:205,damage:27,rate:.46},
{id:'wargreymon',name:'WarGreymon',stage:'Mega',attribute:'Vaccine',field:'Dragons Roar',element:'Fire',attack:'Terra Force',color:'#eab54b',hp:190,speed:175,damage:36,rate:.65},
{id:'metalgarurumon',name:'MetalGarurumon',stage:'Mega',attribute:'Data',field:'Metal Empire',element:'Ice',attack:'Cocytus Breath',color:'#b4c5d5',hp:175,speed:195,damage:33,rate:.54}
];
const STAGES=['Rookie','Champion','Ultimate','Mega','Ultra'],WEIGHTS=[50,30,15,4,1],DUP=[10,25,60,150,400],SAVE_KEY='digimon-survivor-prototype-v2';
const BANNERS=['General','Dragons Roar','Nature Spirits'];
const byId=Object.fromEntries(SPECIES.map(s=>[s.id,s]));
const defaults=()=>({tickets:20,coins:0,owned:['agumon'],selected:'agumon',upgrades:{},pity:{},points:{},best:0,runs:0});
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(!d||typeof d!=='object')return defaults();const v={...defaults(),...d};v.owned=Array.isArray(v.owned)?v.owned.filter(id=>byId[id]):['agumon'];if(!v.owned.length)v.owned=['agumon'];if(!v.owned.includes(v.selected))v.selected=v.owned[0];v.tickets=Math.max(0,Number(v.tickets)||0);v.coins=Math.max(0,Number(v.coins)||0);v.upgrades=v.upgrades||{};v.pity=v.pity||{};v.points=v.points||{};return v;}catch{return defaults();}}
let data=load(),tab='Inicio',banner='General',run=null,keys=new Set(),stick={x:0,y:0},pointer=null,last=0;
const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch{message('No se pudo guardar el progreso.');}},message=s=>{$('status').textContent=s;};
const stageIndex=s=>STAGES.indexOf(s.stage),coinValue=s=>DUP[stageIndex(s)],upgradeLevel=id=>Math.max(0,Math.min(5,Number(data.upgrades[id])||0));
function wallet(){$('wallet').textContent='Tickets '+data.tickets+' · DigiCoins '+data.coins;}
function tabs(){const names=['Inicio','Colección','Gacha','Mejoras','Combate'];$('tabs').innerHTML='';for(const name of names){const b=document.createElement('button');b.textContent=name;b.className=tab===name?'active':'';b.onclick=()=>{if(run&&!run.ended&&name!=='Combate'){run.paused=true;}tab=name;render();};$('tabs').append(b);}}
function card(s,action){const el=document.createElement('div');el.className='card';const h=document.createElement('h3');h.textContent=s.name;h.style.color=s.color;el.append(h);const p=document.createElement('p');p.className='muted';p.textContent=s.stage+' · '+s.attribute+' · '+s.element;el.append(p);const a=document.createElement('p');a.textContent=s.attack;el.append(a);if(action)el.append(action);return el;}
function btn(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b;}
function render(){wallet();tabs();const root=$('content');root.replaceChildren();message('');
if(tab==='Inicio'){root.innerHTML='<section class="panel"><h2>Demo integral v0.4</h2><p>Sobrevive 90 segundos con tu Digimon. Gana tickets y monedas, desbloquea personajes y mejora sus estadísticas.</p><p class="muted">WASD / flechas en PC. En Android, joystick táctil. Ataque automático al enemigo más cercano. Sin digievolución.</p></section>';root.append(btn('Jugar con '+byId[data.selected].name,()=>start(),'primary'));root.append(document.createElement('hr'));const p=document.createElement('p');p.textContent='Mejor tiempo: '+Math.floor(data.best)+'s · Partidas: '+data.runs;root.append(p);}
if(tab==='Colección'){root.innerHTML='<h2>DigiDex ('+data.owned.length+'/'+SPECIES.length+')</h2>';const grid=document.createElement('div');grid.className='cards';for(const s of SPECIES){const owned=data.owned.includes(s.id);const c=card(s,btn(owned?(data.selected===s.id?'Seleccionado':'Seleccionar'):'Bloqueado',()=>{data.selected=s.id;save();render();},owned?'primary':''));c.lastChild.disabled=!owned||data.selected===s.id;grid.append(c);}root.append(grid);}
if(tab==='Mejoras'){root.innerHTML='<h2>Mejoras permanentes</h2><p>+10% HP y +5% daño por nivel (máximo 5). Coste creciente.</p>';const grid=document.createElement('div');grid.className='cards';for(const id of data.owned){const s=byId[id],level=upgradeLevel(id),cost=20*(level+1);const c=card(s,btn(level===5?'Nivel máximo':'Mejorar · '+cost+' DigiCoins',()=>{if(data.coins<cost)return message('DigiCoins insuficientes');data.coins-=cost;data.upgrades[id]=level+1;save();render();},'primary'));c.lastChild.disabled=level>=5||data.coins<cost;const p=document.createElement('p');p.textContent='Nivel '+level+'/5';c.insertBefore(p,c.lastChild);grid.append(c);}root.append(grid);}
if(tab==='Gacha'){root.innerHTML='<h2>Gacha</h2><p>Una tirada cuesta 1 DigiTicket. Duplicados = DigiCoins. Garantía Champion o superior cada 10 tiradas del mismo banner. Cada 30 tiradas: canje por especie del banner.</p>';const nav=document.createElement('div');nav.className='tabs';for(const b of BANNERS)nav.append(btn(b,()=>{banner=b;render();},banner===b?'active':''));root.append(nav);const pool=SPECIES.filter(s=>banner==='General'||s.field===banner);const effective=STAGES.map((st,i)=>pool.some(s=>s.stage===st)?WEIGHTS[i]:0);const sum=effective.reduce((a,b)=>a+b,0);const rate=document.createElement('p');rate.textContent='Tasas efectivas: '+STAGES.filter((_,i)=>effective[i]).map(st=>st+' '+(effective[STAGES.indexOf(st)]/sum*100).toFixed(1)+'%').join(' · ');root.append(rate);const p=document.createElement('p');p.textContent='Pity: '+(data.pity[banner]||0)+'/10 · Puntos: '+(data.points[banner]||0)+'/30';root.append(p);root.append(btn('Invocar ×1',()=>pull(1),'primary'),btn('Invocar ×10',()=>pull(10),'primary'));const h=document.createElement('h3');h.textContent='Canjear 30 puntos';root.append(h);const grid=document.createElement('div');grid.className='cards';for(const s of pool){const c=card(s,btn('Canjear',()=>{if((data.points[banner]||0)<30)return;data.points[banner]-=30;if(data.owned.includes(s.id))data.coins+=coinValue(s);else data.owned.push(s.id);save();render();message('Canje realizado: '+s.name);},''));c.lastChild.disabled=(data.points[banner]||0)<30;grid.append(c);}root.append(grid);}
if(tab==='Combate'){root.innerHTML='<h2>Supervivencia</h2><p id="runHud"></p><div id="gameWrap"><canvas id="game" width="800" height="480"></canvas><div id="stick"><div id="knob"></div></div><div id="levelChoices"></div></div><div class="tabs" style="margin-top:10px" id="runButtons"></div><p class="muted">Mover: WASD, flechas o joystick. Ataque automático. Al subir de nivel, elige una mejora.</p>';setupControls();const actions=$('runButtons');if(!run||run.ended)actions.append(btn('Nueva partida',()=>start(),'primary'));else actions.append(btn(run.paused?'Continuar':'Pausa',()=>{run.paused=!run.paused;draw();},'primary'),btn('Abandonar',()=>finish(false)));draw();}
}
function poolFor(b){return SPECIES.filter(s=>b==='General'||s.field===b);}
function choose(b,guaranteed){const pool=poolFor(b),eligible=pool.filter(s=>!guaranteed||stageIndex(s)>=1),weights=STAGES.map((st,i)=>eligible.some(s=>s.stage===st)?WEIGHTS[i]:0),sum=weights.reduce((a,v)=>a+v,0);let roll=Math.random()*sum;let stage=STAGES[0];for(let i=0;i<STAGES.length;i++){roll-=weights[i];if(roll<0){stage=STAGES[i];break;}}const options=eligible.filter(s=>s.stage===stage);return options[Math.floor(Math.random()*options.length)];}
function pull(n){if(data.tickets<n)return message('Necesitas '+n+' DigiTickets');data.tickets-=n;const results=[];for(let i=0;i<n;i++){const pity=data.pity[banner]||0;const s=choose(banner,pity>=9);data.pity[banner]=stageIndex(s)>=1?0:pity+1;data.points[banner]=(data.points[banner]||0)+1;if(data.owned.includes(s.id)){data.coins+=coinValue(s);results.push(s.name+' (duplicado +'+coinValue(s)+' monedas)');}else{data.owned.push(s.id);results.push('¡NUEVO! '+s.name);}}save();render();message(results.join(' · '));}
function start(){const s=byId[data.selected],lv=upgradeLevel(s.id);run={time:0,hp:s.hp*(1+.1*lv),maxHp:s.hp*(1+.1*lv),kills:0,spawn:0,shot:0,level:1,xp:0,nextXp:7,damage:s.damage*(1+.05*lv),speed:s.speed,rate:s.rate,projectiles:1,paused:false,ended:false,boss:false,player:{x:400,y:240},enemies:[],shots:[],hit:0};tab='Combate';render();}
function finish(win){if(!run||run.ended)return;run.ended=true;run.paused=false;data.runs++;data.best=Math.max(data.best,run.time);const reward=Math.max(1,Math.floor(run.time/15))+(win?5:0),coins=Math.floor(run.kills/3)+(win?25:0);data.tickets+=reward;data.coins+=coins;save();render();message((win?'¡Victoria!':'Fin de partida')+' · +'+reward+' tickets · +'+coins+' DigiCoins');}
function gainXp(){if(run.paused||run.ended)return;run.xp++;if(run.xp>=run.nextXp){run.xp-=run.nextXp;run.level++;run.nextXp+=5;run.paused=true;const box=$('levelChoices');if(!box){run.paused=false;return;}box.style.display='block';box.innerHTML='<h2>Nivel '+run.level+' · Elige mejora</h2>';for(const [label,fn] of [['+20% daño',()=>run.damage*=1.2],['+15% velocidad',()=>run.speed*=1.15],['+20 HP máximo y curar',()=>{run.maxHp+=20;run.hp=Math.min(run.maxHp,run.hp+30);}],['Ataque más rápido',()=>run.rate*=.88]])box.append(btn(label,()=>{fn();box.style.display='none';run.paused=false;}));}}
function update(dt){if(!run||run.ended||run.paused||tab!=='Combate')return;const r=run,p=r.player;r.time+=dt;r.spawn-=dt;r.shot-=dt;r.hit-=dt;const dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'))+stick.x,dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'))+stick.y,len=Math.max(1,Math.hypot(dx,dy));p.x=Math.max(15,Math.min(785,p.x+dx/len*r.speed*dt));p.y=Math.max(15,Math.min(465,p.y+dy/len*r.speed*dt));if(r.spawn<=0){r.spawn=Math.max(.25,.85-r.time*.004);const side=Math.floor(Math.random()*4);r.enemies.push({x:side===0?0:side===1?800:Math.random()*800,y:side===2?0:side===3?480:Math.random()*480,hp:2+Math.floor(r.time/35),boss:false});}
if(!r.boss&&r.time>=65){r.boss=true;r.enemies.push({x:400,y:0,hp:55,boss:true,maxHp:55});}
if(r.shot<=0&&r.enemies.length){r.shot=r.rate;const targets=r.enemies.filter(e=>e.hp>0);if(targets.length){const target=targets.reduce((a,b)=>Math.hypot(p.x-a.x,p.y-a.y)<Math.hypot(p.x-b.x,p.y-b.y)?a:b);const angle=Math.atan2(target.y-p.y,target.x-p.x);for(let i=0;i<r.projectiles;i++){const a=angle+(i-(r.projectiles-1)/2)*.17;r.shots.push({x:p.x,y:p.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,ttl:1.5,damage:r.damage});}}}
for(const e of r.enemies){const d=Math.max(1,Math.hypot(e.x-p.x,e.y-p.y)),spd=e.boss?35:58;e.x+=(p.x-e.x)/d*spd*dt;e.y+=(p.y-e.y)/d*spd*dt;if(d<(e.boss?34:21)&&r.hit<=0){r.hp-=e.boss?20:12;r.hit=.5;}}
for(const s of r.shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.ttl-=dt;for(const e of r.enemies){if(e.hp>0&&Math.hypot(s.x-e.x,s.y-e.y)<(e.boss?33:16)){e.hp-=s.damage/12;s.ttl=0;break;}}}
const dead=r.enemies.filter(e=>e.hp<=0);r.kills+=dead.length;r.enemies=r.enemies.filter(e=>e.hp>0);r.shots=r.shots.filter(s=>s.ttl>0);for(const e of dead){if(!r.paused)gainXp();else r.xp++;}if(r.hp<=0){r.hp=0;finish(false);}else if(r.boss&&!r.enemies.some(e=>e.boss)){finish(true);}else if(r.time>=90){finish(false);}}
function draw(){if(tab!=='Combate'||!$('game')||!run)return;const ctx=$('game').getContext('2d'),r=run,p=r.player;ctx.clearRect(0,0,800,480);ctx.fillStyle='#25404a';ctx.strokeStyle='#35505a';for(let x=0;x<800;x+=40)for(let y=0;y<480;y+=40)ctx.strokeRect(x,y,40,40);for(const e of r.enemies){ctx.fillStyle=e.boss?'#9f4ccf':'#ef6d75';ctx.beginPath();ctx.arc(e.x,e.y,e.boss?30:11,0,Math.PI*2);ctx.fill();if(e.boss){ctx.fillStyle='#101827';ctx.fillRect(e.x-34,e.y-45,68,7);ctx.fillStyle='#f59e0b';ctx.fillRect(e.x-33,e.y-44,66*Math.max(0,e.hp/e.maxHp),5);}}for(const s of r.shots){ctx.fillStyle='#ffdc64';ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fill();}ctx.fillStyle=byId[data.selected].color;ctx.beginPath();ctx.arc(p.x,p.y,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(byId[data.selected].name,p.x,p.y-23);$('runHud').textContent='HP '+Math.ceil(r.hp)+'/'+Math.ceil(r.maxHp)+' · KOs '+r.kills+' · Nivel '+r.level+' · '+Math.floor(r.time)+'/90s'+(r.boss?' · JEFE':'')+(r.paused?' · PAUSA':'');}
function setupControls(){const pad=$('stick');if(!pad)return;const move=e=>{if(pointer!==e.pointerId)return;const rect=pad.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.max(1,Math.hypot(dx,dy)),scale=Math.min(1,len/45);stick={x:dx/len*scale,y:dy/len*scale};$('knob').style.transform='translate('+(stick.x*38)+'px,'+(stick.y*38)+'px)';};pad.onpointerdown=e=>{e.preventDefault();pointer=e.pointerId;pad.setPointerCapture(pointer);move(e);};pad.onpointermove=move;const end=e=>{if(pointer!==e.pointerId)return;pointer=null;stick={x:0,y:0};$('knob').style.transform='';};pad.onpointerup=end;pad.onpointercancel=end;}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k.startsWith('arrow'))e.preventDefault();keys.add(k);});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();stick={x:0,y:0};if(run&&!run.ended)run.paused=true;});
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame);}render();requestAnimationFrame(frame);
</script></body></html>
