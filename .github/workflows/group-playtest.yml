name: Group playtest (isolated)
on:
  push:
    branches:
      - feat/group-playtest-sandbox
      - fix/lab-party-and-resume-slow
      - fix/lab-coop-room-creation
      - feat/lab-combat-analytics
  workflow_dispatch:

concurrency:
  group: group-playtest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check js/core/firebase-config.js
          node --check js/ui/test-lab.js
          node --check js/game.js
          node --check js/net/social.js
          node --check js/ui/social-ui.js
          node --check js/systems/rift.js
          node --check js/entities/player.js
          node --check js/systems/combat.js
          node --check js/systems/combat-stats.js
          node --check js/ui/hud.js
          node --check js/ui/run-ui.js
          node --check js/net/coop.js
          node --check tools/prepare-playtest.cjs
          node --check tools/deploy-playtest.cjs
      - name: Test protection and gameplay
        run: node --test tests/level-transition.test.cjs tests/playtest-lab.test.cjs tests/party-invitations.test.cjs tests/combat-stats.test.cjs
      - name: Build preview for Etéma sandbox
        run: node tools/prepare-playtest.cjs
      - name: Ensure production config is absent
        run: |
          test -f dist-test/index.html
          test -f dist-test/sandbox-config.js
          test -f dist-test/js/app.min.js
          grep -q 'ps-test-etema-261016' dist-test/sandbox-config.js
          ! grep -q 'pokesurvivor-free' dist-test/sandbox-config.js
          node -e "const c=require('./playtest-config.json');if(c.projectId!=='ps-test-etema-261016'||c.authDomain!==c.projectId+'.firebaseapp.com')process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: group-playtest-local-preview
          path: dist-test/
          retention-days: 7
