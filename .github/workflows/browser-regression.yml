name: Browser and PWA regression
on:
  push:
    branches:
      - work/browser-pwa-reliability
      - work/save-integrity
      - fix/account-session-isolation

permissions:
  contents: write

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/core/updater.js && node --check sw.js && node --check js/core/audio.js
      - run: node --test tests/audio-visibility.test.cjs
      - run: node tools/build.js
      - run: node tools/export_data.js
      - run: python3 tools/make_seo_pages.py
      - run: node --test tests/browser-pwa.test.cjs
      - run: node --test tests/save-integrity.test.cjs
      - run: node --test tests/account-session.test.cjs
      - run: node --test tests/browser-chromium.test.cjs
      - name: Commit generated browser preview (fork branch only)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en/index.html js/app.min.js version.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh fork browser artifacts [skip ci]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
